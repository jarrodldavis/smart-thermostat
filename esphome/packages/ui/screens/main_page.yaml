lvgl:
  pages:
    - id: main_page
      styles: screen
      scrollable: false
      layout:
        type: GRID
        grid_rows:
        - 28
        - 24
        - 40
        - 40
        - 40
        - 40
        grid_columns:
        - FR(1)
        - FR(1)
        grid_cell_x_align: STRETCH
        grid_cell_y_align: STRETCH
        pad_row: 2
        pad_column: 6
      widgets:
      - label:
          text: Waiting for sensor
          long_mode: wrap
          styles: large_text
          id: current_label
          grid_cell_row_pos: 0
          grid_cell_column_pos: 0
          grid_cell_column_span: 2
          grid_cell_y_align: CENTER
      - label:
          text: Equipment setup required
          long_mode: wrap
          id: status_label
          grid_cell_row_pos: 1
          grid_cell_column_pos: 0
          grid_cell_column_span: 2
          grid_cell_y_align: CENTER
      - button:
          scrollable: false
          on_click:
          - lvgl.page.show: mode_page
          - script.execute: ui_beep
          widgets:
          - label:
              text: 'Mode: Off'
              long_mode: wrap
              align: center
              id: mode_label
          grid_cell_row_pos: 2
          grid_cell_column_pos: 0
      - buttonmatrix:
          scrollable: false
          rows:
          - buttons:
            - text: Fan auto
              control:
                no_repeat: true
                checkable: true
              on_click:
              - climate.control:
                  id: hvac_climate
                  fan_mode: AUTO
              - script.execute: ui_beep
              id: fan_auto
            - text: Fan on
              control:
                no_repeat: true
                checkable: true
              on_click:
              - climate.control:
                  id: hvac_climate
                  fan_mode: 'ON'
              - script.execute: ui_beep
              id: fan_on
          one_checked: true
          grid_cell_row_pos: 2
          grid_cell_column_pos: 1
      - label:
          text: Heat --
          long_mode: wrap
          id: heat_target_label
          grid_cell_row_pos: 3
          grid_cell_column_pos: 0
          grid_cell_y_align: CENTER
      - buttonmatrix:
          scrollable: false
          rows:
          - buttons:
            - text: '-'
              control:
                no_repeat: true
              on_click:
              - script.execute:
                  id: adjust_target
                  heating: true
                  delta: -0.5
              - script.execute: refresh_ui
              - script.execute: ui_beep
            - text: +
              control:
                no_repeat: true
              on_click:
              - script.execute:
                  id: adjust_target
                  heating: true
                  delta: 0.5
              - script.execute: refresh_ui
              - script.execute: ui_beep
          grid_cell_row_pos: 3
          grid_cell_column_pos: 1
      - label:
          text: Cool --
          long_mode: wrap
          id: cool_target_label
          grid_cell_row_pos: 4
          grid_cell_column_pos: 0
          grid_cell_y_align: CENTER
      - buttonmatrix:
          scrollable: false
          rows:
          - buttons:
            - text: '-'
              control:
                no_repeat: true
              on_click:
              - script.execute:
                  id: adjust_target
                  heating: false
                  delta: -0.5
              - script.execute: refresh_ui
              - script.execute: ui_beep
            - text: +
              control:
                no_repeat: true
              on_click:
              - script.execute:
                  id: adjust_target
                  heating: false
                  delta: 0.5
              - script.execute: refresh_ui
              - script.execute: ui_beep
          grid_cell_row_pos: 4
          grid_cell_column_pos: 1
      - buttonmatrix:
          scrollable: false
          rows:
          - buttons:
            - text: Settings
              control:
                no_repeat: true
              on_click:
              - lvgl.page.show: settings_menu
              - script.execute: ui_beep
            - text: Diagnostics
              control:
                no_repeat: true
              on_click:
              - lvgl.page.show: diagnostics_page
              - script.execute: ui_beep
          grid_cell_row_pos: 5
          grid_cell_column_pos: 0
          grid_cell_column_span: 2

script:
  - id: !extend refresh_ui
    then:
    - lvgl.label.update:
        id: current_label
        text: !lambda |-
          float t = id(room_temperature).state;
          if (!std::isfinite(t)) return std::string("Waiting for sensor");
          bool f = id(display_units).current_option().str() == "Fahrenheit";
          const float h = id(room_humidity).state;
          const auto humidity = std::isfinite(h) ? str_sprintf("%.0f%%", h) : std::string("--%");
          return str_sprintf("%.1f %s  %s", f ? celsius_to_fahrenheit(t) : t,
            f ? "F" : "C", humidity.c_str());
    - lvgl.label.update:
        id: status_label
        text: !lambda |-
          if (id(updating)) return std::string("Update shutdown; restart to resume");
          if (!id(commissioned)) return std::string("Equipment setup required");
          if (id(temperature_fault).state) return std::string("Temperature sensor fault");
          return str_sprintf("%s | Stage %d", id(heat_source).state.c_str(), (id(relay_y2).state ? 2 : id(relay_y1).state ? 1 : 0));
    - lvgl.label.update:
        id: heat_target_label
        text: !lambda |-
          const float c = id(hvac_climate).target_temperature_low;
          const bool f = id(display_units).current_option() == "Fahrenheit";
          return f ? str_sprintf("Heat %.0f F", smeisner::to_display(c, true, smeisner::TemperatureKind::ABSOLUTE)) :
                     str_sprintf("Heat %.1f C", c);
    - lvgl.label.update:
        id: cool_target_label
        text: !lambda |-
          const float c = id(hvac_climate).target_temperature_high;
          const bool f = id(display_units).current_option() == "Fahrenheit";
          return f ? str_sprintf("Cool %.0f F", smeisner::to_display(c, true, smeisner::TemperatureKind::ABSOLUTE)) :
                     str_sprintf("Cool %.1f C", c);
    - lvgl.label.update:
        id: mode_label
        text: !lambda |-
          if (id(hvac_climate).get_custom_preset() == "Emergency heat") return std::string("Mode: Emergency Heat");
          switch (id(hvac_climate).mode) {
           case climate::CLIMATE_MODE_HEAT: return std::string("Mode: Heat");
           case climate::CLIMATE_MODE_COOL: return std::string("Mode: Cool");
           case climate::CLIMATE_MODE_HEAT_COOL: return std::string("Mode: Heat/Cool");
           case climate::CLIMATE_MODE_FAN_ONLY: return std::string("Mode: Fan only");
           default: return std::string("Mode: Off");
          }
    - lvgl.widget.update:
        id: fan_auto
        state:
          checked: !lambda |-
            return id(hvac_climate).fan_mode == climate::CLIMATE_FAN_AUTO;
    - lvgl.widget.update:
        id: fan_on
        state:
          checked: !lambda |-
            return id(hvac_climate).fan_mode == climate::CLIMATE_FAN_ON;

  - id: adjust_target
    parameters:
      heating: bool
      delta: float
    then:
    - if:
        condition:
          lambda: return heating;
        then:
        - climate.control:
            id: hvac_climate
            target_temperature_low: !lambda |-
              const bool f = id(display_units).current_option() == "Fahrenheit";
              return smeisner::adjust_display(id(hvac_climate).target_temperature_low, delta > 0 ? 1 : -1, f,
                smeisner::TemperatureKind::ABSOLUTE, 0.5f, 1.0f, 7.0f, id(hvac_climate).target_temperature_high - 2.0f);
        else:
        - climate.control:
            id: hvac_climate
            target_temperature_high: !lambda |-
              const bool f = id(display_units).current_option() == "Fahrenheit";
              return smeisner::adjust_display(id(hvac_climate).target_temperature_high, delta > 0 ? 1 : -1, f,
                smeisner::TemperatureKind::ABSOLUTE, 0.5f, 1.0f, id(hvac_climate).target_temperature_low + 2.0f, 35.0f);
