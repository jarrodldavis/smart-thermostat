# Runs the thermostat and climate package on the host.
# Sensors and GPIO outputs use templates for host execution.
substitutions:
  default_equipment: Heat pump
  default_stages: '2'
  default_backup: Electric supplemental
  compressor_off_time: 2s
  stage2_off_time: 2s
  source_settle_time: 1s

esphome:
  name: thermostat-test
  compile_process_limit: 4
  includes:
    - thermostat_test.h
  on_boot:
    - priority: -200
      then:
        - lambda: |-
            thermostat_test::check(id(hvac_climate).preset == climate::CLIMATE_PRESET_HOME && id(hvac_climate).mode == climate::CLIMATE_MODE_OFF, "startup applies the Home preset in Off mode");
            thermostat_test::check(id(hvac_climate).target_temperature_low == 20 && id(hvac_climate).target_temperature_high == 24, "startup uses Home target temperatures");
        - switch.turn_on: auto_backup
        - lambda: |-
            id(commissioned) = true;
            // Short test durations cover controller timers and output interlocks.
            id(hvac_climate).set_heating_minimum_off_time_in_sec(1);
            id(hvac_climate).set_cooling_minimum_off_time_in_sec(1);
            id(hvac_climate).set_heating_minimum_run_time_in_sec(10);
            id(hvac_climate).set_idle_minimum_time_in_sec(1);
            id(hvac_climate).set_heating_maximum_run_time_in_sec(1);
            id(room_temperature).publish_state(18.5f);
        - climate.control:
            id: hvac_climate
            mode: HEAT
            fan_mode: AUTO
            target_temperature_low: 20
            target_temperature_high: 24
        - delay: 250ms
        - lambda: |-
            thermostat_test::check(!id(relay_y1).state, "startup lockout");
            thermostat_test::check(!id(stage2_requested).state && !id(local_backup_requested).state, "no stages before heat");
        - delay: 1s
        - lambda: |-
            thermostat_test::check(id(hvac_climate).action == climate::CLIMATE_ACTION_HEATING, "heat action");
            thermostat_test::check(id(relay_y1).state, "heat action applies outputs immediately");
            thermostat_test::check(id(stage2_requested).state && !id(local_backup_requested).state, "first supplemental callback");
            thermostat_test::check(id(relay_y2).state && !id(relay_aux).state, "first callback selects Y2 only");
        - delay: 1100ms
        - lambda: |-
            thermostat_test::check(id(stage2_requested).state && id(local_backup_requested).state, "repeated supplemental callback");
            thermostat_test::check(id(relay_y1).state && id(relay_y2).state && id(relay_aux).state,
                               "second callback selects electric backup");
            id(room_temperature).publish_state(25);
            thermostat_test::check(id(hvac_climate).action == climate::CLIMATE_ACTION_HEATING,
                               "minimum run timer holds the call");
            thermostat_test::check(id(relay_y1).state, "routing follows minimum run timer");
            // Suspend supplemental callbacks to isolate the interlock retry.
            id(hvac_climate).set_heating_maximum_run_time_in_sec(60);
            id(room_temperature).publish_state(NAN);
            thermostat_test::check(!id(relay_y1).state && !id(relay_y2).state && !id(relay_aux).state,
                               "sensor fault overrides minimum run immediately");
            thermostat_test::check(!id(stage2_requested).state && !id(local_backup_requested).state, "fault clears stage requests");
            id(room_temperature).publish_state(18.5f);
            thermostat_test::check(!id(relay_y1).state, "actual compressor stop starts physical lockout");
        - climate.control:
            id: hvac_climate
            fan_mode: 'ON'
        - lambda: thermostat_test::before_wait = thermostat_test::routing_evaluations;
        - delay: 1100ms
        - lambda: |-
            thermostat_test::check(thermostat_test::routing_evaluations <= thermostat_test::before_wait + 2,
                               "only pre-change and backup-settle deadlines wake HVAC during the wait");
            thermostat_test::check(id(continuous_fan_requested).state && id(relay_g).state, "fan-mode callback");
        - delay: 1200ms
        - lambda: |-
            thermostat_test::check(id(relay_y1).state, "scheduled interlock retry resumes demand");
        - climate.control:
            id: hvac_climate
            mode: 'OFF'
        - lambda: |-
            thermostat_test::check(!id(relay_g).state && !id(relay_y1).state && !id(relay_aux).state,
                               "explicit off overrides fan and heating");
        - script.execute: equipment_scenarios

host:
logger:
  level: WARN
packages:
  climate: !include ../../packages/climate.yaml
# Count output-routing evaluations.
script:
  - id: !extend apply_hvac
    then:
      - lambda: ++thermostat_test::routing_evaluations;
  - id: set_test_timings
    then:
      - lambda: |-
          id(hvac_climate).set_heating_minimum_off_time_in_sec(1);
          id(hvac_climate).set_cooling_minimum_off_time_in_sec(1);
          id(hvac_climate).set_heating_minimum_run_time_in_sec(1);
          id(hvac_climate).set_cooling_minimum_run_time_in_sec(1);
          id(hvac_climate).set_idle_minimum_time_in_sec(1);
          id(hvac_climate).set_heating_maximum_run_time_in_sec(1);
          id(hvac_climate).set_cooling_maximum_run_time_in_sec(1);
  - id: prepare_equipment_test
    then:
      - climate.control: {id: hvac_climate, mode: 'OFF', fan_mode: AUTO}
      - script.execute: set_test_timings
      - delay: 2200ms
      # An active timer setter can complete its timer without storing
      # the new duration. Apply fixture overrides again after reaching idle.
      - script.execute: set_test_timings
      - button.press: commission_button
      - sensor.template.publish: {id: room_temperature, state: 18.5}
  - id: equipment_scenarios
    then:
      # Conventional W and thermostat-owned fan, followed by two-stage cooling.
      - select.set: {id: equipment, option: Conventional}
      - select.set: {id: backup_type, option: None}
      - select.set: {id: heating_fan, option: Thermostat controlled}
      - script.execute: prepare_equipment_test
      - script.wait: prepare_equipment_test
      - climate.control: {id: hvac_climate, mode: HEAT}
      - wait_until: {condition: {switch.is_on: relay_w}, timeout: 3s}
      - lambda: |-
          thermostat_test::check(id(relay_w).state && id(relay_g).state, "conventional heat and heating fan ownership");
          thermostat_test::check(!id(relay_y1).state && !id(relay_y2).state && !id(relay_aux).state, "conventional heat uses W only");
          // Falling-edge counts detect brief W/G interruptions that final-state
          // assertions cannot detect.
          const unsigned w_stops = thermostat_test::falling_edges[0];
          const unsigned fan_stops = thermostat_test::falling_edges[3];
          id(room_temperature).publish_state(18.6f);
          id(room_humidity).publish_state(40);
          id(room_temperature).publish_state(18.7f);
          id(room_humidity).publish_state(41);
          thermostat_test::check(thermostat_test::falling_edges[0] == w_stops, "sensor updates must not pulse conventional W");
          thermostat_test::check(thermostat_test::falling_edges[3] == fan_stops, "sensor updates must not pulse thermostat-owned heating fan");
      - climate.control: {id: hvac_climate, custom_preset: Emergency heat}
      - lambda: |-
          thermostat_test::check(id(hvac_climate).get_custom_preset() != "Emergency heat", "conventional equipment rejects emergency preset");
          thermostat_test::check(id(hvac_climate).mode == climate::CLIMATE_MODE_OFF && !id(relay_w).state && !id(relay_aux).state && !id(relay_y1).state, "unsupported preset leaves conventional equipment Off");
      - sensor.template.publish: {id: room_temperature, state: 20.5}
      - wait_until: {condition: {switch.is_off: relay_w}, timeout: 3s}
      - lambda: thermostat_test::check(!id(relay_w).state, "thermostat ends the heating call");
      - sensor.template.publish: {id: room_temperature, state: 27}
      - climate.control: {id: hvac_climate, mode: COOL}
      - wait_until: {condition: {switch.is_on: relay_y2}, timeout: 4s}
      - lambda: thermostat_test::check(id(relay_y1).state && id(relay_y2).state && id(relay_g).state && !id(relay_w).state, "two-stage conventional cooling");
      - climate.control: {id: hvac_climate, mode: 'OFF'}

      # Repeated supplemental callbacks must select Y2 before furnace takeover.
      - select.set: {id: equipment, option: Heat pump}
      - select.set: {id: backup_type, option: Furnace replacement}
      - select.set: {id: heating_fan, option: Equipment controlled}
      - script.execute: prepare_equipment_test
      - script.wait: prepare_equipment_test
      - climate.control: {id: hvac_climate, mode: HEAT}
      - wait_until: {condition: {switch.is_on: relay_y2}, timeout: 3s}
      - lambda: thermostat_test::check(id(relay_y2).state && !id(relay_aux).state, "Y2 precedes furnace backup");
      - wait_until: {condition: {switch.is_on: relay_aux}, timeout: 4s}
      - lambda: thermostat_test::check(id(relay_aux).state && !id(relay_y1).state && !id(relay_y2).state && !id(relay_g).state, "furnace takeover and equipment-owned fan");
      - sensor.template.publish: {id: room_temperature, state: 19.9}
      - delay: 100ms
      - lambda: thermostat_test::check(id(relay_aux).state, "backup stays selected until call ends");
      - climate.control: {id: hvac_climate, mode: 'OFF'}

      # Emergency takeover, return, and cancellation during its pending delay.
      - switch.turn_off: auto_backup
      - script.execute: prepare_equipment_test
      - script.wait: prepare_equipment_test
      - climate.control: {id: hvac_climate, mode: HEAT}
      - wait_until: {condition: {switch.is_on: relay_y2}, timeout: 3s}
      - climate.control: {id: hvac_climate, custom_preset: Emergency heat}
      - delay: 100ms
      - lambda: thermostat_test::check(!id(relay_y1).state && !id(relay_y2).state && !id(relay_aux).state, "furnace emergency transition is all off");
      - wait_until: {condition: {switch.is_on: relay_aux}, timeout: 2s}
      - lambda: |-
          thermostat_test::check(id(relay_aux).state, "emergency backup starts after script delay");
          thermostat_test::check(id(hvac_climate).mode == climate::CLIMATE_MODE_HEAT && id(hvac_climate).get_custom_preset() == "Emergency heat", "emergency preset selects Heat mode");
      - climate.control: {id: hvac_climate, preset: HOME}
      - lambda: thermostat_test::check(!id(relay_aux).state && !id(relay_y1).state, "backup stops before compressor return");
      - wait_until: {condition: {switch.is_on: relay_y1}, timeout: 4s}
      - lambda: thermostat_test::check(id(relay_y1).state && !id(relay_aux).state, "compressor returns through cooldown waits");
      - climate.control: {id: hvac_climate, custom_preset: Emergency heat}
      - delay: 100ms
      - sensor.template.publish: {id: room_temperature, state: !lambda return NAN;}
      - delay: 1200ms
      - lambda: |-
          thermostat_test::check(!id(relay_aux).state && !id(relay_y1).state && !id(relay_y2).state, "fault cancels pending furnace start");
          thermostat_test::check(!id(start_backup).is_running() && !id(start_compressor).is_running(), "fault cancels delayed scripts");
      - climate.control: {id: hvac_climate, mode: 'OFF'}

      - climate.control: {id: hvac_climate, custom_preset: Emergency heat}
      - number.set: {id: stage_delta, value: 2}
      - lambda: |-
          thermostat_test::check(!id(commissioned) && id(hvac_climate).mode == climate::CLIMATE_MODE_OFF && id(hvac_climate).get_custom_preset() != "Emergency heat", "equipment changes exit emergency heat and require commissioning");
          thermostat_test::check(!id(relay_y1).state && !id(relay_y2).state && !id(relay_aux).state, "equipment changes inhibit all heat sources");
      - number.set: {id: stage_delta, value: 1}

      # Outdoor selection, latch, and stale-data fallback to callbacks.
      - select.set: {id: backup_policy, option: Outdoor temperature}
      - number.set: {id: balance_point, value: 0}
      - switch.turn_on: balance_confirmed
      - switch.turn_on: auto_backup
      - sensor.template.publish: {id: outdoor_control_temperature, state: -10}
      - script.execute: prepare_equipment_test
      - script.wait: prepare_equipment_test
      - climate.control: {id: hvac_climate, mode: HEAT}
      - wait_until: {condition: {switch.is_on: relay_aux}, timeout: 3s}
      - lambda: thermostat_test::check(id(relay_aux).state && !id(relay_y1).state, "outdoor policy selects furnace");
      - sensor.template.publish: {id: outdoor_control_temperature, state: 10}
      - script.execute: apply_hvac
      - lambda: thermostat_test::check(id(relay_aux).state, "outdoor recovery does not interrupt selected backup");
      - climate.control: {id: hvac_climate, mode: 'OFF'}
      - sensor.template.publish: {id: outdoor_control_temperature, state: !lambda return NAN;}
      - script.execute: prepare_equipment_test
      - script.wait: prepare_equipment_test
      - climate.control: {id: hvac_climate, mode: HEAT}
      - wait_until: {condition: {switch.is_on: relay_y2}, timeout: 3s}
      - lambda: thermostat_test::check(id(relay_y2).state && !id(relay_aux).state, "stale outdoor data permits first supplemental stage");
      - wait_until: {condition: {switch.is_on: relay_aux}, timeout: 4s}
      - lambda: thermostat_test::check(id(relay_aux).state && !id(relay_y1).state, "stale outdoor fallback uses later callback");
      - climate.control: {id: hvac_climate, mode: 'OFF'}

      # Single-stage heat pump: first callback selects electric backup; Either
      # must allow local demand even when valid outdoor data is above balance.
      - select.set: {id: compressor_stages, option: '1'}
      - select.set: {id: backup_type, option: Electric supplemental}
      - select.set: {id: backup_policy, option: Either}
      - sensor.template.publish: {id: outdoor_control_temperature, state: 10}
      - script.execute: prepare_equipment_test
      - script.wait: prepare_equipment_test
      - climate.control: {id: hvac_climate, mode: HEAT}
      - wait_until: {condition: {switch.is_on: relay_aux}, timeout: 3s}
      - lambda: thermostat_test::check(id(relay_aux).state && id(relay_y1).state && !id(relay_y2).state, "single-stage electric backup on first callback");
      - climate.control: {id: hvac_climate, custom_preset: Emergency heat}
      - lambda: thermostat_test::check(id(relay_aux).state && !id(relay_y1).state && !id(relay_y2).state, "electric emergency heat uses AUX exclusively");
      - climate.control: {id: hvac_climate, mode: 'OFF'}
      - lambda: thermostat_test::check(id(hvac_climate).get_custom_preset() != "Emergency heat", "Off clears emergency preset");
      - climate.control: {id: hvac_climate, custom_preset: Emergency heat}
      - wait_until: {condition: {switch.is_on: relay_aux}, timeout: 4s}
      - lambda: thermostat_test::check(id(relay_aux).state && !id(relay_y1).state && !id(relay_y2).state, "preset selected from Off heats with backup exclusively");
      - climate.control: {id: hvac_climate, target_temperature_low: 21}
      - lambda: thermostat_test::check(id(hvac_climate).get_custom_preset() == "Emergency heat" && id(hvac_climate).target_temperature_low == 21, "emergency target remains adjustable");
      - climate.control: {id: hvac_climate, mode: COOL}
      - lambda: thermostat_test::check(id(hvac_climate).get_custom_preset() != "Emergency heat" && !id(relay_aux).state, "cooling mode exits emergency heat");
      - climate.control: {id: hvac_climate, mode: 'OFF'}

      - select.set: {id: backup_type, option: Furnace replacement}
      - select.set: {id: backup_policy, option: Local demand}
      - script.execute: prepare_equipment_test
      - script.wait: prepare_equipment_test
      - climate.control: {id: hvac_climate, mode: HEAT}
      - wait_until: {condition: {switch.is_on: relay_aux}, timeout: 3s}
      - lambda: thermostat_test::check(id(relay_aux).state && !id(relay_y1).state && !id(relay_y2).state, "single-stage furnace backup on first callback");
      - climate.control: {id: hvac_climate, mode: 'OFF'}

      - select.set: {id: backup_type, option: None}
      - script.execute: prepare_equipment_test
      - script.wait: prepare_equipment_test
      - climate.control: {id: hvac_climate, mode: HEAT}
      - wait_until: {condition: {switch.is_on: relay_y1}, timeout: 3s}
      - delay: 1100ms
      - climate.control: {id: hvac_climate, custom_preset: Emergency heat}
      - lambda: |-
          thermostat_test::check(id(hvac_climate).mode == climate::CLIMATE_MODE_OFF && !id(relay_y1).state && !id(relay_y2).state && !id(relay_aux).state, "unsupported emergency request leaves no-backup equipment Off");
          thermostat_test::check(id(hvac_climate).get_custom_preset() != "Emergency heat", "unsupported emergency heat cannot activate");
      - climate.control: {id: hvac_climate, mode: 'OFF'}
      # Heat/cool reversals must settle O/B and share the physical compressor
      # off timer even though the heat and cool timers are independent.
      - sensor.template.publish: {id: room_temperature, state: 27}
      - climate.control: {id: hvac_climate, mode: COOL}
      - wait_until: {condition: {switch.is_on: relay_y1}, timeout: 4s}
      - lambda: thermostat_test::check(id(relay_y1).state && id(relay_ob).state && !id(relay_y2).state, "heat-pump cooling energizes O/B after settling");
      - sensor.template.publish: {id: room_temperature, state: 18.5}
      - climate.control: {id: hvac_climate, mode: HEAT}
      - wait_until: {condition: {switch.is_off: relay_y1}, timeout: 2s}
      - lambda: thermostat_test::check(!id(relay_y1).state, "direction change stops physical compressor");
      - wait_until: {condition: {switch.is_on: relay_y1}, timeout: 4s}
      - lambda: thermostat_test::check(id(relay_y1).state && !id(relay_ob).state, "compressor returns in heating after valve and off delays");
      - climate.control: {id: hvac_climate, mode: 'OFF'}

      # Energized O/B must be retained on Off and on a sensor fault.
      - sensor.template.publish: {id: room_temperature, state: 27}
      - climate.control: {id: hvac_climate, mode: COOL}
      - wait_until:
          condition:
            and:
              - switch.is_on: relay_y1
              - switch.is_on: relay_ob
              - lambda: return id(hvac_climate).action == climate::CLIMATE_ACTION_COOLING;
          timeout: 5s
      - lambda: thermostat_test::check(id(relay_y1).state && id(relay_ob).state, "cooling before O/B retention checks");
      - sensor.template.publish: {id: room_temperature, state: !lambda return NAN;}
      - lambda: thermostat_test::check(id(relay_ob).state && !id(relay_y1).state, "fault stops the running compressor and retains O/B");
      - climate.control: {id: hvac_climate, mode: 'OFF'}
      - lambda: thermostat_test::check(id(relay_ob).state && !id(relay_y1).state, "Off retains O/B while stopping compressor");

      # Turning retention off requests a controlled deenergization, including
      # the pre-change interval after the actual compressor stop.
      - switch.turn_off: retain_valve_on_stop
      - lambda: thermostat_test::check(id(relay_ob).state, "O/B does not drop immediately after compressor stop");
      - wait_until: {condition: {switch.is_off: relay_ob}, timeout: 2s}
      - lambda: thermostat_test::check(!id(relay_ob).state && !id(relay_y1).state, "non-retained Off deenergizes O/B after pre-delay");

      # An already-off compressor permits the valve command immediately, but
      # the independent post-change interval must still inhibit startup.
      - script.execute: prepare_equipment_test
      - script.wait: prepare_equipment_test
      - sensor.template.publish: {id: room_temperature, state: 27}
      - climate.control: {id: hvac_climate, mode: COOL}
      - wait_until: {condition: {switch.is_on: relay_ob}, timeout: 3s}
      - lambda: thermostat_test::check(id(relay_ob).state && !id(relay_y1).state, "post-change delay holds compressor off");
      - delay: 100ms
      - lambda: thermostat_test::check(!id(relay_y1).state, "post-change delay is not bypassed");
      - wait_until: {condition: {switch.is_on: relay_y1}, timeout: 3s}
      - lambda: thermostat_test::check(id(relay_y1).state, "compressor starts after post-change delay");
      - climate.control: {id: hvac_climate, mode: 'OFF'}
      - switch.turn_on: retain_valve_on_stop
      # A longer pre-delay leaves a pending valve change after the
      # thermostat's one-second idle interval has already elapsed.
      - lambda: thermostat_test::expected_pre_ms = 2000;
      - number.set: {id: valve_pre_change_delay, value: 2}
      - script.execute: prepare_equipment_test
      - script.wait: prepare_equipment_test
      - climate.control: {id: hvac_climate, mode: HEAT}
      - wait_until:
          condition:
            and:
              - switch.is_on: relay_y1
              - switch.is_off: relay_ob
          timeout: 4s
      - lambda: thermostat_test::check(id(relay_y1).state && !id(relay_ob).state, "heating before pre-change cancellation");

      # Cancel an in-flight energization during its pre-change interval.
      - sensor.template.publish: {id: room_temperature, state: 27}
      - climate.control: {id: hvac_climate, mode: COOL}
      - wait_until:
          condition:
            and:
              - switch.is_off: relay_y1
              - lambda: return id(hvac_climate).action == climate::CLIMATE_ACTION_COOLING;
          timeout: 2s
      - lambda: thermostat_test::check(!id(relay_ob).state, "pre-change delay retains old O/B command");
      - sensor.template.publish: {id: room_temperature, state: !lambda return NAN;}
      - delay: 1200ms
      - lambda: thermostat_test::check(!id(relay_ob).state && !id(relay_y1).state && !id(change_valve).is_running(), "fault cancels a pending valve command");
      - sensor.template.publish: {id: room_temperature, state: 27}
      - climate.control: {id: hvac_climate, mode: COOL}
      - wait_until: {condition: {switch.is_on: relay_ob}, timeout: 4s}
      - lambda: thermostat_test::check(id(relay_ob).state && !id(relay_y1).state, "new valve command still observes post-delay");
      - climate.control: {id: hvac_climate, mode: 'OFF'}
      - delay: 1200ms
      - lambda: thermostat_test::check(id(relay_ob).state && !id(relay_y1).state && !id(start_compressor).is_running(), "Off cancels pending post-delay compressor start");

      # Zero is a supported setting, independent of the compressor cooldown.
      - lambda: thermostat_test::expected_pre_ms = thermostat_test::expected_post_ms = 0;
      - number.set: {id: valve_pre_change_delay, value: 0}
      - number.set: {id: valve_post_change_delay, value: 0}
      - script.execute: prepare_equipment_test
      - script.wait: prepare_equipment_test
      - climate.control: {id: hvac_climate, mode: HEAT}
      - wait_until: {condition: {switch.is_on: relay_y1}, timeout: 3s}
      - lambda: |-
          thermostat_test::check(id(relay_y1).state && !id(relay_ob).state, "zero-delay valve change permits heating");
          thermostat_test::check(uint32_t(millis() - thermostat_test::valve_changed) < 500, "zero post-delay does not add a hidden wait");
      - sensor.template.publish: {id: room_temperature, state: 27}
      - climate.control: {id: hvac_climate, mode: COOL}
      - wait_until: {condition: {switch.is_on: relay_ob}, timeout: 3s}
      - lambda: |-
          thermostat_test::check(id(relay_ob).state && !id(relay_y1).state, "zero pre-delay still stops compressor before O/B change");
          thermostat_test::check(!id(valve_pre_change).is_running(), "zero pre-delay is complete; idle timing can still defer the command");

      # Retention also applies to the update-shutdown hook, while powered.
      - script.execute: stop_for_update
      - delay: 2200ms
      - lambda: thermostat_test::check(id(relay_ob).state, "update shutdown retains O/B");
      - lambda: |-
          thermostat_test::check(id(updating) && !id(relay_y1).state && !id(relay_y2).state && !id(relay_aux).state && !id(relay_g).state,
                             "update shutdown overrides demand and cancels delayed starts");
      - lambda: |-
          std::printf("ESPHome thermostat integration passed (%u physical writes checked)\n", thermostat_test::output_writes);
          std::exit(0);
number:
  - id: !extend valve_pre_change_delay
    initial_value: 1
  - id: !extend valve_post_change_delay
    initial_value: 1
sensor:
  - platform: template
    id: room_temperature
    update_interval: never
  - platform: template
    id: room_humidity
    update_interval: never
  - platform: template
    id: outdoor_control_temperature
    update_interval: never
output:
  - platform: template
    id: hvac_pin_w
    type: binary
    write_action:
      - lambda: thermostat_test::record(0, state, id(backup_type).current_option() == "Furnace replacement", millis());
  - platform: template
    id: hvac_pin_y1
    type: binary
    write_action:
      - lambda: thermostat_test::record(1, state, id(backup_type).current_option() == "Furnace replacement", millis());
  - platform: template
    id: hvac_pin_y2
    type: binary
    write_action:
      - lambda: thermostat_test::record(2, state, id(backup_type).current_option() == "Furnace replacement", millis());
  - platform: template
    id: hvac_pin_g
    type: binary
    write_action:
      - lambda: thermostat_test::record(3, state, id(backup_type).current_option() == "Furnace replacement", millis());
  - platform: template
    id: hvac_pin_ob
    type: binary
    write_action:
      - lambda: thermostat_test::record(4, state, id(backup_type).current_option() == "Furnace replacement", millis());
  - platform: template
    id: hvac_pin_aux
    type: binary
    write_action:
      - lambda: thermostat_test::record(5, state, id(backup_type).current_option() == "Furnace replacement", millis());
  - platform: template
    id: led_heat
    type: binary
    write_action:
      - lambda: (void)state;
  - platform: template
    id: led_cool
    type: binary
    write_action:
      - lambda: (void)state;
  - platform: template
    id: led_fan
    type: binary
    write_action:
      - lambda: (void)state;
