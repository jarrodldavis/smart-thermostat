packages:
  main_screen: !include ui/screens/main_page.yaml
  mode_screen: !include ui/screens/mode_page.yaml
  settings_menu: !include ui/screens/settings_menu.yaml
  equipment_settings: !include ui/screens/equipment.yaml
  backup_settings: !include ui/screens/backup.yaml
  staging_settings: !include ui/screens/staging.yaml
  display_settings: !include ui/screens/display.yaml
  calibration_settings: !include ui/screens/calibration.yaml
  diagnostics_screen: !include ui/screens/diagnostics_page.yaml
  wifi_setup_screen: !include ui/screens/wifi_setup_page.yaml

esphome:
  on_boot:
    - priority: -100
      then:
      - script.execute: wake_screen
      - script.execute: refresh_ui
  includes:
  - <ui_temperature.h>
  - ../include/ui_temperature.h
lvgl:
  id: thermostat_ui
  displays:
  - panel
  rotation: 90
  touchscreens:
  - touchscreen_id: panel_touch
    id: panel_touch_listener
  buffer_size: 10%
  color_depth: 16
  default_font: montserrat_14
  resume_on_input: true
  on_pause:
    - light.turn_off: screen_backlight
  on_resume:
    - script.execute: update_backlight
  style_definitions:
  - id: screen
    pad_all: 8
    bg_color: 1319218
    text_color: 16777215
  - id: large_text
    text_font: montserrat_20
  - id: centered_text
    text_align: center
  theme:
    dark_mode: true
    button:
      height: 40
      bg_color: 2506069
      text_color: 16777215
    buttonmatrix:
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      pad_row: 6
      pad_column: 6
      items:
        bg_color: 2506069
        text_color: 16777215
        radius: 5
        checked:
          bg_color: 1668818
        disabled:
          bg_color: 3159098
          text_color: 8947848

script:
- id: wake_screen
  then:
  # Resume resets LVGL's inactivity counter and redraws the screen.
  - lvgl.resume: null
- id: update_backlight
  then:
  - if:
      condition:
        not:
          lvgl.is_paused:
            lvgl_id: thermostat_ui
      then:
      - light.turn_on:
          id: screen_backlight
          brightness: !lambda |-
            if (!id(auto_brightness).state) return 0.7f;
            float level = id(ambient_light).state / 3.3f;
            return std::isfinite(level) ? std::max(0.2f, std::min(1.0f, level)) : 0.7f;
- id: ui_beep
  mode: restart
  then:
  - if:
      condition:
        switch.is_on: beep_enabled
      then:
      - output.set_level:
          id: buzzer_pwm
          level: 30%
      - delay: 50ms
      - output.turn_off: buzzer_pwm
- id: refresh_ui
  then: []
interval:
- interval: 1s
  then:
  # Recheck while presence holds the screen awake, so clearing presence can
  # still permit sleep even if the idle timeout was crossed earlier.
  - if:
      condition:
        and:
        - lvgl.is_idle:
            lvgl_id: thermostat_ui
            timeout: !lambda return uint32_t(id(sleep_seconds).state * 1000);
        - not:
            lvgl.is_paused:
              lvgl_id: thermostat_ui
        - binary_sensor.is_off: presence_pin
        - binary_sensor.is_off: radar_presence
      then:
      - lvgl.pause:
          show_snow: false
  - script.execute: update_backlight
  - script.execute: refresh_ui
