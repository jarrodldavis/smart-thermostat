# Equivalent to an adopted user configuration. Change release to a published tag.
substitutions:
  name: hallway-thermostat
  friendly_name: Hallway Thermostat
packages:
  thermostat:
    url: https://github.com/jarrodldavis/smart-thermostat
    ref: esphome-v0.1.0
    files: [esphome/smart-thermostat.yaml]
    refresh: 0s
esphome:
  name_add_mac_suffix: false
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
api:
  encryption:
    key: !secret thermostat_api_key
